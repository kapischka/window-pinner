<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pokémon Preorder Bot{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="topnav">
  <span class="brand">🔔 Pokémon Preorder Bot</span>
  <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' else '' }}">Dashboard</a>
  <a href="{{ url_for('targets_page') }}" class="{{ 'active' if request.endpoint == 'targets_page' else '' }}">Manage Targets</a>
  <a href="{{ url_for('logs_page') }}" class="{{ 'active' if request.endpoint == 'logs_page' else '' }}">Logs</a>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashes">
      {% for category, message in messages %}
        <li class="flash flash-{{ category }}">{{ message }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script>
  // Slow actions (a check can take 1-2 min) get disabled on submit so a
  // double-click can't fire two overlapping requests - fast CRUD forms
  // elsewhere are left alone since they resolve almost instantly.
  document.querySelectorAll("form.slow-action").forEach(function (form) {
    form.addEventListener("submit", function () {
      var btn = form.querySelector("button");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Working…";
      }
    });
  });
</script>
</body>
</html>
