    search_url: "https://jk-entertainment.de/search?search={q}"
  - name: Comicplanet
    platform: html
    url: "https://www.comicplanet.de"
    pages:
      - "https://www.comicplanet.de/sammelkarten/pokemon/deutsch/top-trainer-boxen-pkm/"
      - "https://www.comicplanet.de/sammelkarten/pokemon/deutsch/specials-pkm/"
      - "https://www.comicplanet.de/sammelkarten/pokemon/deutsch/displays-pkm/booster-pkm/"
    search_url: "https://www.comicplanet.de/search?sSearch={q}"
  - name: Netto
    platform: html
    url: "https://www.netto-online.de"
    pages: ["https://www.netto-online.de/pok-mon-tcg-30th-celebration-m6a-booster-display-japanische-edition-/p-3193575000"]
    language: JP
    assume_pokemon: true
    interval: 30
  - name: Smyths Toys
    platform: html
    url: "https://www.smythstoys.com"
    pages: ["https://www.smythstoys.com/de/de-de/spielzeug/action-spielzeug/pokemon/pokemon-karten/pokemon-karten-top-trainer-box-30-jahre-edition/p/264148"]
    language: DE
    assume_pokemon: true
    interval: 30

  # --- Smaller shops (off) -------------------------------------------------
