  # --- eBay (on) -----------------------------------------------------------
  # Only products with a known UVP, only the cheapest offer per product, and
  # only within the markup limit, so the flood of scalper listings stays out.
  - name: eBay
    platform: ebay
    url: "https://www.ebay.de"
    queries:
      - "pokemon 30 jahre top trainer box"
      - "pokemon 30 jahre booster bundle"
      - "pokemon 30 jahre poster kollektion"
      - "pokemon 30 jahre ordner kollektion"
      - "pokemon 30 jahre tech sticker kollektion"
      - "pokemon 30 jahre ultra premium kollektion"
      - "pokemon 30th celebration display japanisch"
      - "pokemon 30th celebration premium deck"
    interval: 90
    require_reference: true
    best_per_product: true
    exclude: ["promo", "leer", "ohne", "aus der", "aus top", "geöffnet", "sleeves", "hüllen", "code card", "lose ", "einzeln"]

