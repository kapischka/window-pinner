# Shops for the live monitor (python -m pokemon_preorder_bot.live).
#
# Watches every product of the 30th anniversary set: German "30 Jahre"
# (Top-Trainer-Box, Poster-, Tech-Sticker-, Ordner-, Knock-out-Kollektion,
# 2er-Pack-Blister, Feelinara-ex / Quajutsu-ex Kollektion, Booster Bundle …)
# and Japanese "30th CELEBRATION" (M6a Display, Premium Deck Set Espeon &
# Umbreon, FUTURISTIC BOX, Card Sets …). Matching is done on the product
# title, so new products are picked up without touching this file.
#
# platform:
#   shopify      - queries /search/suggest.json and, if given, the
#                  /collections/<handle>/products.json of each collection.
#                  Tiny JSON responses, the fastest and most reliable source.
#   woocommerce  - queries the public Store API /wp-json/wc/store/v1/products.
#   html         - downloads `pages` and `search_url` (with {q} replaced by
#                  each query) and reads JSON-LD, microdata or card text.
#                  A page that fails is skipped as long as another one works.
#   auto         - probes Shopify and WooCommerce on the first poll and then
#                  behaves like the detected one. For shops whose platform
#                  isn't known for sure.
#   ebay         - searches ebay.de for each query: Sofort-Kaufen, new,
#                  located in Germany, cheapest first.
#
# render: true      html only. Loads pages in a hidden Chrome, for shops that
#                   build their product list with JavaScript (MediaMarkt …).
#                   Slower, so give these a longer interval.
# require_reference: only listings that match a product in `prices` count.
# best_per_product: only the cheapest offer per product counts (marketplaces).
# exclude:          extra title words to skip for this shop.
#
# language: assumed edition when a title has no hint ("Japanisch", "DE",
#           "M6a", "30 Jahre" …). "?" means unknown.
# assume_pokemon: the page only lists Pokémon products, so generic wording
#           like "30 Jahre" counts even without "Pokémon" in the title.
# interval: per-shop override of settings.interval_seconds.
# enabled:  false switches a shop off without deleting it.
#
# All URLs come from web research (Oct 2026). Run `--once` after changes: a
# shop showing `error` has a wrong platform/URL, `blocked` means it rate
# limits or runs a bot check, so give it a larger interval.

settings:
  interval_seconds: 10
  languages: [DE, JP]
  include_unknown_language: true
  # Preorders ("Vorbestellung", "Pre-Order", a release date still ahead …)
  # are hidden, only stock that ships now counts. true shows them again.
  include_preorders: false
  queries:
    - "30th celebration"
    - "30 jahre"
    - "m6a"
  exclude:
    - "einzelkarte"
    - "single card"
    - "psa "
    - " cgc"
    - "graded"
    - "grading"
    - "leeres display"
    - "leerbox"
    - "empty box"
    - "plüsch"
    - "plush"
    - "t-shirt"
    - "hoodie"
    - "tasse"
    - "lego"
    - "proxy"
  # Only used for html shops without structured data.
  status_patterns:
    preorder:
      - "vorbestellen"
      - "vorbestellung"
      - "vorbestellbar"
      - "vorverkauf"
      - "pre-order"
      - "preorder"
    in_stock:
      - "in den warenkorb"
      - "sofort lieferbar"
      - "sofort verfügbar"
      - "auf lager"
      - "jetzt kaufen"
      - "add to cart"
      - "in den einkaufswagen"
      - "online verfügbar"
    unavailable:
      - "ausverkauft"
      - "nicht verfügbar"
      - "nicht lieferbar"
      - "nicht auf lager"
      - "momentan nicht"
      - "benachrichtigen"
      - "demnächst"
      - "sold out"
      - "out of stock"

# Markup check. Every listing whose title matches a product below gets its
# price compared with the reference: the official UVP for German products,
# a typical import price ("Richtpreis") for Japanese ones, which have no
# German UVP. Listings more than max_markup_percent above it are hidden and
# never alerted (changeable in the window, null = no limit). Listings more
# than min_markup_percent below it are dropped as implausible: a single
# promo card, an empty box or a fake. First matching entry wins, so keep
# specific names above generic ones.
prices:
  max_markup_percent: 50
  min_markup_percent: -50
  products:
    # German UVPs from monsterdealz/pcgames (Sept 2026). Marked "geschätzt"
    # where no official figure was found.
    - {name: "Ultra-Premium-Kollektion", language: DE, uvp: 149.99, match: 'ultra[\s-]*premium'}  # geschätzt
    - {name: "Top-Trainer-Box", language: DE, uvp: 54.99, match: 'top[\s-]*trainer'}
    - {name: "Booster Bundle", language: DE, uvp: 29.99, match: 'booster[\s-]*bundle'}
    - {name: "Poster-Kollektion", language: DE, uvp: 23.99, match: 'poster'}
    - {name: "Ordner-Kollektion", language: DE, uvp: 23.99, match: 'ordner'}
    - {name: "Tech-Sticker-Kollektion", language: DE, uvp: 18.99, match: 'tech[\s-]*sticker'}
    - {name: "ex-Kollektion", language: DE, uvp: 24.99, match: 'feelinara|quajutsu|ex[\s-]*kollektion'}
    - {name: "Knock-out-Kollektion", language: DE, uvp: 12.99, match: 'knock[\s-]*out'}  # geschätzt
    - {name: "Mini Tin", language: DE, uvp: 13.99, match: 'mini[\s-]*tin'}
    - {name: "2er-Pack-Blister", language: DE, uvp: 12.99, match: '2er[\s-]*pack|blister'}
    # Japanese: yen UVP (Display 7.200 ¥, Premium Deck 6.200 ¥, Futuristic
    # Box 27.500 ¥, Card Set 1.200 ¥) plus what German importers typically
    # charge. Adjust to taste.
    - {name: "FUTURISTIC BOX", language: JP, uvp: 300, kind: Richtpreis, match: 'futuristic'}
    - {name: "Premium Deck Set", language: JP, uvp: 130, kind: Richtpreis, match: 'premium[\s-]*deck|espeon|umbreon'}
    - {name: "Card Set", language: JP, uvp: 15, kind: Richtpreis, match: 'card[\s-]*set|カードセット'}
    - {name: "Display (20 Booster)", language: JP, uvp: 160, kind: Richtpreis, match: 'display|booster[\s-]*box|\bbox\b'}

