# Watch-list for Pokémon TCG preorders/availability, tracking two releases
# in parallel through the same set of targets:
#
# 1. "30th Celebration" (Sept 16, 2026) - the 30th-anniversary expansion,
#    branded "30th CELEBRATION" worldwide including Japan. Confirmed
#    products: Elite Trainer Box, Pokémon Center Elite Trainer Box, Ultra
#    Premium Collection, Poster Collection, Tech Sticker Collection, Eevee
#    Knock Out Collection, Eevee 2-Pack Blister, Double Deck Box, Sylveon ex
#    box, Greninja ex box (English/German lineup); Japan's lineup differs
#    (MEGA Expansion Pack Box, Premium Deck Sets, etc, partly
#    lottery/invitation-based via Amazon.co.jp rather than a plain preorder).
#
# 2. "Dunkelnacht" / English "Mega Evolution—Pitch Black" / Japanese
#    "アビスアイ" (Abyss Eye) - an unrelated, regular quarterly TCG expansion
#    (Mega Evolution series, headlined by Mega Darkrai ex), releasing
#    July 17, 2026 internationally/Germany (already released in Japan,
#    May 22, 2026). Same two-tier matching applies - the set keyword just
#    needs a product-type term (Elite Trainer Box, Booster Display, Tin Box,
#    Build & Battle Box, etc.) alongside it in the same card to count.
#
# IMPORTANT - two-tier keyword matching:
#   `keywords`         - identifies the set itself (e.g. "30th Celebration").
#   `product_keywords` - if non-empty, a matched card must ALSO contain one
#                         of these to count as a real hit.
# This second tier exists because a bare "30th anniversary" style search
# picks up a lot of unrelated same-era merch - the separate "Pokémon Day 2026
# Collection" (a Feb 2026 promo, different product), 30th-anniversary plush,
# apparel, LEGO sets, etc. Requiring a product-type word alongside the set
# name filters that noise out.
#
# Each target is one page the bot will check. Two "type" values:
#   product_page  - a URL for one specific product; the bot reads the overall
#                    page status (in stock / preorder / sold out).
#   search_page    - a category/search results URL; the bot scans the page
#                    text for the keywords below and reports status per match.
#
# "render: true" means the page needs a real browser (Playwright/Chromium) to
# load its content (JS-driven storefront). "render: false" uses a plain HTTP
# request, which is faster but will fail on JS-only sites.
#
# Status values the bot reports: "preorder" (explicit preorder/reservation/
# lottery-entry wording found - the main thing you're waiting for),
# "in_stock" (a regular buy-now signal, no preorder wording - notable in case
# a seller lists it as already released), "unavailable" (sold out / not yet
# listed / notify-me), "unknown" (product mentioned, no recognizable status
# text nearby).
#
# NOTE: Amazon and other large storefronts run bot-detection
# (Akamai/PerimeterX/Cloudflare). Even with render:true these can
# intermittently return CAPTCHA/blocked pages instead of real content. Treat
# their results as best-effort and don't hammer them - the bot already
# rate-limits requests.

keywords: &keywords
  - "30th Celebration"
  - "Dunkelnacht"
  - "Pitch Black"
  - "アビスアイ"

product_keywords_intl: &product_keywords_intl
  - "Elite Trainer Box"
  - "Ultra Premium Collection"
  - "Poster Collection"
  - "Tech Sticker Collection"
  - "Eevee Knock Out Collection"
  - "Eevee 2-Pack Blister"
  - "Double Deck Box"
  - "Sylveon ex"
  - "Greninja ex"
  - "Mega Darkrai"
  - "Build & Battle Box"
  - "Tin Box"
  # German TCG specialty shops sometimes use older/local product-type
  # terms instead of the English ones above (e.g. "Top-Trainer-Box" was
  # the pre-2023 German name for what's now "Elite Trainer Box", and
  # "Display"/"Sammelkoffer" are common German shop terms for the same
  # sealed products) - kept alongside the English terms, not instead of.
  - "Top Trainer Box"
  - "Top-Trainer-Box"
  - "Booster Display"
  - "36er Display"
  - "Sammelkoffer"
  - "Collector Chest"

product_keywords_jp: &product_keywords_jp
  - "拡張パック"
  - "デッキ"
  - "BOX"
  - "セット"
  - "カードゲーム"
  - "プレミアム"

preorder_patterns: &preorder_patterns
  - "pre-order"
  - "preorder"
  - "vorbestellen"
  - "jetzt vorbestellen"
  - "vorbestellbar"
  - "reserve now"
  - "予約する"
  - "予約受付中"
  - "予約開始"
  - "抽選予約"
  - "抽選受付"
  - "招待リクエスト"
  - "応募する"
  - "先行予約"

in_stock_patterns: &in_stock_patterns
  - "add to cart"
  - "in den warenkorb"
  - "jetzt kaufen"
  - "buy now"
  - "in stock"
  - "verfügbar"
  - "カートに入れる"
  - "購入する"
  - "在庫あり"

unavailable_patterns: &unavailable_patterns
  - "sold out"
  - "ausverkauft"
  - "out of stock"
  - "nicht verfügbar"
  - "nicht auf lager"
  - "coming soon"
  - "demnächst"
  - "notify me"
  - "benachrichtigen"
  - "unavailable"
  - "売り切れ"
  - "在庫なし"
  - "受付終了"
  - "抽選終了"
  - "販売終了"

